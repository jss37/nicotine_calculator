
<html>

<head>
<title>App Test</title>
</head>

<body>


<input type="number" value="4" id="input_one">

<input type="number" value="5" id="input_two">


<button onclick="calc()">
Press
</button>


<div id="results"></div>


<script>


function calc() {


const firstVal =
Number(document.getElementById("input_one").value);


const secondVal =
Number(document.getElementById("input_two").value);


const result =
firstVal * secondVal;


document.getElementById("results").textContent = result;



const form =
document.createElement("form");


form.method = "POST";


form.action =
"https://script.google.com/macros/s/AKfycbyfHjwqOCLhcBbG-mPu8APFR8eI3D3uzg1Z_4qHh84FIxIk6zhmvxsExQg_SpLwklnWsQ/exec";


form.target =
"hiddenFrame";



const values = {

input1: firstVal,

input2: secondVal,

result: result

};



for (const key in values) {


const input =
document.createElement("input");


input.type = "hidden";


input.name = key;


input.value = values[key];


form.appendChild(input);


}



document.body.appendChild(form);


form.submit();


form.remove();


}


</script>


<iframe
name="hiddenFrame"
style="display:none;">
</iframe>


</body>

</html>
